name: Build Menyoo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # storia e tag completi: generate-version.ps1 potrebbe leggere la versione da git

      - name: Controlla file necessari
        shell: pwsh
        run: |
          $required = @(
            'Solution/external/premake/premake5.exe',
            'tools/generate-version.ps1',
            'Solution/external/ScriptHookV/SDK/lib',
            'Solution/external/MinHook/src',
            'Solution/external/pugixml/src/pugixml.cpp',
            'Solution/external/imgui/imgui.cpp',
            'Solution/external/ImGuizmo/ImGuizmo.cpp',
            'Solution/external/d3dhook/D3D11Hook.cpp'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "File o cartelle mancanti nel repo:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

      - name: Assicura un tag di versione
        shell: pwsh
        run: |
          # generate-version.ps1 richiede un tag v<major>.<minor>.<patch> raggiungibile da HEAD.
          # Se il repo non ne ha, ne crea uno locale (non viene pubblicato).
          $tag = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --merged HEAD | Select-Object -First 1
          if (-not $tag) {
            Write-Host "Nessun tag di versione trovato, creo v1.8.1 locale"
            git tag v1.8.1
          } else {
            Write-Host "Tag trovato: $tag"
          }

      - name: Genera soluzione Visual Studio (Premake)
        shell: cmd
        run: Solution\external\premake\premake5.exe vs2022

      - uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        shell: cmd
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 Solution\Menyoo.sln

      - uses: actions/upload-artifact@v4
        with:
          name: Menyoo-Release
          path: Solution/source/_Build/bin/Release/Menyoo.asi
          if-no-files-found: error
