name: Menyoo Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate solution with Premake
        run: Solution/external/premake/premake5.exe vs2022

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 Solution/Menyoo.sln -verbosity:minimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MenyooSP
          path: |
            Solution/source/_Build/bin/Release/
            !Solution/source/_Build/bin/Release/Trash/
            !Solution/source/_Build/bin/Release/*.map
          if-no-files-found: error
